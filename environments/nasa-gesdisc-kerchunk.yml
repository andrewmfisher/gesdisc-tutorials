name: nasa-gesdisc-kerchunk
channels:
  - conda-forge
dependencies:
  - python=3.12
  - sqlite>=3.45
  - numpy=2.4.3        
  - pandas=2.3.3       
  - pyarrow=23.0.1     
  - xarray
  - fsspec
  - zarr
  - aiohttp
  - dask
  - distributed
  - matplotlib
  - cartopy
  # HDF5 2.1 emits native error stacks when libraries probe virtual URLs or
  # not-yet-created output paths. Keep the compatible 1.14 line until the
  # xarray/h5py/h5netcdf stack fully supports HDF5 2.x.
  - hdf5>=1.14,<2
  - h5py
  - h5netcdf
  - netCDF4
  - pip
  - pip:
    - earthaccess
    - notebook
    - ipywidgets
    - widgetsnbextension
    - terra_ui_components
    - kerchunk
    - fastparquet==2026.3.0
    - s3fs
    - virtualizarr
