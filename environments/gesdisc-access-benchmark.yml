name: gesdisc-access-benchmark
channels:
  - conda-forge
dependencies:
  - python=3.12

  # Lazy array access and computation
  - xarray=2026.7.0
  - dask=2026.7.1
  - numpy=2.4.3
  - pandas=2.3.3

  # Kerchunk reference-store access over HTTPS
  - fsspec=2026.7.0
  - zarr=3.3.0
  - aiohttp=3.14.3

  # OPeNDAP access
  - pydap=3.5.11

  # Benchmark progress, plotting, and optional NetCDF output
  - tqdm=4.70.0
  - matplotlib=3.11.1
  - netcdf4=1.7.5

  - pip=26.2.1
  - pip:
      - earthaccess==0.18.0
      - fastparquet==2026.3.0
